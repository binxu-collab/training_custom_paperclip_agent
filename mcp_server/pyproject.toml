[project]
name = "gxl-tools"
version = "0.1.0"
description = "GXL Tools and MCP Servers"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "elasticsearch>=8.0.0",  # For BioMedRxiv semantic search
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "biopython>=1.83",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",  # For BioMedRxiv XML parsing
    "tavily-python>=0.3.0",
    "PyPDF2>=3.0.1",
    "PyMuPDF>=1.24.0",  # For FDA PDF processing (x86_64 wheels available)
    "psycopg2-binary>=2.9.0",  # For database connections (local dev)
    "pyyaml>=6.0",
    "google-cloud-storage>=2.10.0",
    "google-cloud-aiplatform>=1.40.0",
    "e2b-code-interpreter>=0.0.10",
    "cachetools>=5.3.0",
    "httpx>=0.27.0",
    "requests-toolbelt>=1.0.0",
    "python-dotenv>=1.0.0",
    "psycopg[binary]>=3.1.0",
    "gxl-filesystem",
    "google-cloud-secret-manager>=2.16.0",
    "cloud-sql-python-connector[pg8000]>=1.11.0",  # For Cloud SQL IAM auth
    "elasticsearch>=8.0.0",  # For FDA document search
    "RestrictedPython>=7.0",  # For secure Python sandbox
    "google-cloud-bigquery>=3.40.1",
]

[project.scripts]
protein-design-mcp = "mcps.protein_design.servers.stdio_server:main"
protein-design-mcp-http = "mcps.protein_design.servers.http_server:main"
papers-mcp = "mcps.papers.servers.papers_server:main"
pmc-mcp = "mcps.papers.servers.papers_server:main_pmc"
paperclip-mcp = "mcps.paperclip.servers.paperclip_server:main"
paperclip-lite-mcp = "mcps.paperclip.servers.paperclip_lite_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcps", "src/modules", "src/tools_service", "src/shared"]
